name: 功能建议
description: 建议新的传感器、算法、界面或协议能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述使用场景，而不只是实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: 硬件与兼容性影响
      description: 是否需要新模块、引脚或破坏现有 BLE 协议？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我理解该项目不是医疗器械。
          required: true
        - label: 我没有提交任何敏感信息或个人健康数据。
          required: true
